-pcsx_rearmed_display_internal_fps = disabled
-pcsx_rearmed_show_input_settings = disabled
minarch_rewind_buffer_mb = 128
minarch_rewind_granularity = 33
minarch_rewind_compression_speed = 12
minarch_rewind_compression = On

pcsx_rearmed_dithering = enabled
# GPU commands on a second core: Tekken 3 on the Brick went from 154 to 58 late frames a minute (2026-10-13)
pcsx_rearmed_gpu_thread_rendering = enabled

minarch_gamepad_type = 1
bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Circle = A
bind Cross = B
bind Triangle = X
bind Square = Y
bind L1 Button = L1
bind R1 Button = R1
bind L2 Button = L2
bind R2 Button = R2

# Brick OS: schedutil dropped to 408-816 MHz between frames and ramped too late for heavy scenes
# (Bloody Roar II, 2026-11-09: ~30 late frames a second on 408-2000, nearly none at a 1200+ floor; 1416 still lost ~1.5 a second there, so 1608)
minarch_cpu_min = 1608
